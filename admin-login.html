<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login admin | Campus Partner Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body data-page="admin-login" data-access="public">
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <header id="app-nav"></header>

  <!-- 7.1 Admin / 7.2 Login Admin -->
  <main id="main" class="container py-4 py-lg-5">
    <div class="row gy-4 gx-lg-5">
      <div class="col-12 col-lg-5">
        <h1 class="page-title mb-3">Login admin</h1>
        <p class="lede">Untuk memeriksa foto KTM mahasiswa yang baru mendaftar. Mahasiswa masuk lewat <a href="auth.html">halaman Masuk</a>.</p>
      </div>

      <div class="col-12 col-lg-6 offset-lg-1">
        <div class="panel">
          <ul class="tabs mb-4" role="tablist">
            <li role="presentation">
              <button class="nav-link active" id="tab-login" data-bs-toggle="tab" data-bs-target="#pane-login" type="button" role="tab" aria-controls="pane-login" aria-selected="true">Login</button>
            </li>
            <li role="presentation">
              <button class="nav-link" id="tab-signup" data-bs-toggle="tab" data-bs-target="#pane-signup" type="button" role="tab" aria-controls="pane-signup" aria-selected="false">Buat akun admin</button>
            </li>
          </ul>

          <div class="tab-content">
            <div class="tab-pane active" id="pane-login" role="tabpanel" aria-labelledby="tab-login" tabindex="0">
              <div id="login-alert"></div>
              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label for="login-email" class="form-label">Email admin</label>
                  <input type="email" class="form-control" id="login-email" autocomplete="email" required>
                  <div class="invalid-feedback" id="login-email-error"></div>
                </div>
                <div class="mb-4">
                  <label for="login-password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="login-password" autocomplete="current-password" required>
                  <div class="invalid-feedback" id="login-password-error"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Masuk</button>
              </form>
            </div>

            <div class="tab-pane" id="pane-signup" role="tabpanel" aria-labelledby="tab-signup" tabindex="0">
              <div id="signup-alert"></div>
              <form id="signup-form" novalidate>
                <div class="mb-3">
                  <label for="signup-email" class="form-label">Email admin</label>
                  <input type="email" class="form-control" id="signup-email" autocomplete="email" required>
                  <div class="invalid-feedback" id="signup-email-error"></div>
                </div>
                <div class="mb-4">
                  <label for="signup-password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="signup-password" autocomplete="new-password" aria-describedby="signup-password-help" required>
                  <div class="form-text" id="signup-password-help">Minimal 6 karakter.</div>
                  <div class="invalid-feedback" id="signup-password-error"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Buat akun admin</button>
              </form>
            </div>
          </div>
        </div>

        <p class="small-text mt-3"><a href="index.html">Kembali ke beranda</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/admin-login.js"></script>
</body>
</html>
