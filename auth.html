<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk atau daftar | Campus Partner Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body data-page="auth" data-access="public">
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <header id="app-nav"></header>

  <!-- 2.1 Daftar / Masuk -->
  <main id="main" class="container py-4 py-lg-5">
    <div class="row gy-4 gx-lg-5">
      <div class="col-12 col-lg-5">
        <h1 class="page-title mb-3">Masuk atau daftar</h1>
        <p class="lede">Pakai email kampus Anda. Setelah daftar, isi profil anonim dan unggah foto KTM. Admin memverifikasi akun sebelum papan kampanye terbuka.</p>
      </div>

      <div class="col-12 col-lg-6 offset-lg-1">
        <div class="panel">
          <ul class="tabs mb-4" id="auth-tabs" role="tablist">
            <li role="presentation">
              <button class="nav-link" id="tab-masuk" data-bs-toggle="tab" data-bs-target="#pane-masuk" type="button" role="tab" aria-controls="pane-masuk" aria-selected="false">Masuk</button>
            </li>
            <li role="presentation">
              <button class="nav-link" id="tab-daftar" data-bs-toggle="tab" data-bs-target="#pane-daftar" type="button" role="tab" aria-controls="pane-daftar" aria-selected="false">Daftar</button>
            </li>
          </ul>

          <div class="tab-content">
            <!-- Form Masuk -->
            <div class="tab-pane" id="pane-masuk" role="tabpanel" aria-labelledby="tab-masuk" tabindex="0">
              <div id="login-alert"></div>
              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label for="login-email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="login-email" autocomplete="email" placeholder="nama@student.ub.ac.id" required>
                  <div class="invalid-feedback" id="login-email-error"></div>
                </div>
                <div class="mb-4">
                  <label for="login-password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="login-password" autocomplete="current-password" required>
                  <div class="invalid-feedback" id="login-password-error"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Masuk</button>
              </form>
            </div>

            <!-- Form Daftar -->
            <div class="tab-pane" id="pane-daftar" role="tabpanel" aria-labelledby="tab-daftar" tabindex="0">
              <div id="register-alert"></div>
              <form id="register-form" novalidate>
                <div class="mb-3">
                  <label for="reg-email" class="form-label">Email kampus</label>
                  <input type="email" class="form-control" id="reg-email" autocomplete="email" placeholder="nama@student.ub.ac.id" required>
                  <div class="invalid-feedback" id="reg-email-error"></div>
                </div>
                <div class="mb-4">
                  <label for="reg-password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="reg-password" autocomplete="new-password" minlength="6" aria-describedby="reg-password-help" required>
                  <div class="form-text" id="reg-password-help">Minimal 6 karakter.</div>
                  <div class="invalid-feedback" id="reg-password-error"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Daftar</button>
              </form>
            </div>
          </div>
        </div>

        <p class="small-text mt-3">Anda admin? <a href="admin-login.html">Login admin</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/auth.js"></script>
</body>
</html>
