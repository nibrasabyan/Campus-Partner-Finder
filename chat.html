<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Percakapan | Campus Partner Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body data-page="chat" data-access="approved">
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <header id="app-nav"></header>

  <!-- 6.2 Percakapan + 6.3 Kesepakatan / Deal + 6.4 Status Diambil -->
  <main id="main" class="container py-4 py-lg-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-9">
        <a class="back-link mb-3" href="chats.html">Kembali ke obrolan</a>
        <div id="chat-alert"></div>

        <div class="chat-shell d-none" id="chat-card">
          <div class="chat-head">
            <div class="d-flex flex-column flex-md-row gap-3 justify-content-between align-items-md-center">
              <div class="d-flex align-items-center gap-3">
                <span id="partner-avatar"></span>
                <div>
                  <h1 class="section-title" id="partner-label">Anonim</h1>
                </div>
              </div>
              <div class="d-flex align-items-center gap-3 flex-wrap">
                <div id="source-note"></div>
                <button type="button" class="btn btn-stamp" id="deal-btn" data-bs-toggle="modal" data-bs-target="#deal-modal">Deal</button>
              </div>
            </div>
          </div>

          <div id="deal-status" aria-live="polite"></div>

          <div class="chat-box" id="chat-box" role="log" aria-live="polite" aria-label="Riwayat pesan" tabindex="0"></div>

          <div class="chat-foot">
            <form id="message-form" class="d-flex gap-2" novalidate>
              <label for="message-input" class="visually-hidden">Tulis pesan</label>
              <input type="text" class="form-control" id="message-input" maxlength="1000" placeholder="Tulis pesan..." autocomplete="off">
              <button type="submit" class="btn btn-primary" id="send-btn">Kirim</button>
            </form>
            <div class="invalid-feedback d-block" id="message-error" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 6.3 Modal konfirmasi Deal -->
    <div class="modal fade" id="deal-modal" tabindex="-1" aria-labelledby="deal-modal-title" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title" id="deal-modal-title">Tandai Deal?</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
          </div>
          <div class="modal-body">
            <p class="mb-2">Pastikan Anda dan <strong id="modal-partner">partner</strong> sudah sepakat. Setelah Deal:</p>
            <ul class="mb-0">
              <li><span id="modal-ref-type">Kampanye</span> diberi cap <strong>Diambil</strong>.</li>
              <li>Orang lain tidak bisa mengirim Connect lagi.</li>
              <li>Obrolan ini ditutup.</li>
            </ul>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Batal</button>
            <button type="button" class="btn btn-stamp" id="confirm-deal-btn">Ya, Deal</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/chat.js"></script>
</body>
</html>
